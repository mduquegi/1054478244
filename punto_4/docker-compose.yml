services:
  servicio_api: 
  build: ./api
  container_name: contenedor_parcial
  ports:
   -"5005:5009"
  depends_on:
   -servicio_db
  
  servicio_php:
    image: php:8.2 -cli
    container_name: contenedor_php_script
    working_dir: /app
    volumes:
     -./php_src:/app
    command: php_procesar.php

  servicio_db:
    image: mysql:8.0
    environment: 
      MYSQL_ROOT_PASSWORD: secret
      volumes:
       -datos_mysql:/var/mysql
  
  volumes: 
    datos_mysql
 